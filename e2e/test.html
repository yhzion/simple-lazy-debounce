<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Lazy Debounce E2E Test</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    .stats { display: flex; gap: 20px; margin: 20px 0; }
    .stat { padding: 16px; background: #f5f5f5; border-radius: 8px; text-align: center; flex: 1; }
    .stat-value { font-size: 32px; font-weight: bold; }
    .stat-label { color: #666; font-size: 14px; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; margin-right: 8px; }
    #clickBtn { background: #2196F3; color: white; }
    #resetBtn { background: #f44336; color: white; }
    #log { background: #1e1e1e; color: #fff; padding: 16px; border-radius: 8px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .log-click { color: #64B5F6; }
    .log-exec { color: #81C784; }
  </style>
</head>
<body>
  <h1>Simple Lazy Debounce E2E Test</h1>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="clickCount">0</div>
      <div class="stat-label">Total Clicks</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="execCount">0</div>
      <div class="stat-label">Callbacks Executed</div>
    </div>
  </div>

  <div style="margin: 20px 0;">
    <button id="clickBtn">Click Me</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="log"></div>

  <script src="../dist/index.umd.cjs"></script>
  <script>
    const { SimpleLazyDebounce } = window['simple-lazy-debounce'];

    let clickCount = 0;
    let execCount = 0;
    const startTime = Date.now();

    const clickCountEl = document.getElementById('clickCount');
    const execCountEl = document.getElementById('execCount');
    const logEl = document.getElementById('log');
    const clickBtn = document.getElementById('clickBtn');
    const resetBtn = document.getElementById('resetBtn');

    function addLog(type, message) {
      const time = ((Date.now() - startTime) / 1000).toFixed(2);
      const div = document.createElement('div');
      div.className = type === 'click' ? 'log-click' : 'log-exec';
      div.textContent = '[' + time + 's] ' + type.toUpperCase() + ' ' + message;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    const debouncedAction = SimpleLazyDebounce((num) => {
      execCount++;
      execCountEl.textContent = execCount;
      addLog('exec', 'Callback executed for click #' + num);
    }, {
      defaultDelay: 300,
      maxDelay: 1000,
      latencyIncrement: 200
    });

    clickBtn.addEventListener('click', () => {
      clickCount++;
      clickCountEl.textContent = clickCount;
      addLog('click', 'Button clicked (#' + clickCount + ')');
      debouncedAction(clickCount);
    });

    resetBtn.addEventListener('click', () => {
      clickCount = 0;
      execCount = 0;
      clickCountEl.textContent = '0';
      execCountEl.textContent = '0';
      while (logEl.firstChild) {
        logEl.removeChild(logEl.firstChild);
      }
    });
  </script>
</body>
</html>
